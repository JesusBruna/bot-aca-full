<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente Tiendas Full - ACA</title>
<style>
  :root {
    --red: #c0392b;
    --red-dark: #9c2d22;
    --bg: #f5f5f4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    background: #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  #widget {
    width: 100%;
    max-width: 420px;
    height: 640px;
    background: var(--bg);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    background: var(--red);
    color: white;
    padding: 14px 16px;
  }
  #header .title { font-weight: 600; font-size: 14px; }
  #header .subtitle { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    margin-bottom: 10px;
    font-size: 14.5px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .bubble.bot {
    background: white;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    background: #1a1a1a;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .row { display: flex; }
  .actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn {
    background: white;
    border: 1px solid #ccc;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .btn:hover { background: #f0f0f0; }
  .btn-primary {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-top: 6px;
  }
  .btn-primary:hover { background: var(--red-dark); }
  #contact-form {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  #contact-form input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  #inputbar {
    border-top: 1px solid #ddd;
    background: white;
    padding: 10px;
    display: flex;
    gap: 8px;
  }
  #inputbar input {
    flex: 1;
    border: 1px solid #ccc;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 14px;
    outline: none;
  }
  #inputbar input:focus { border-color: var(--red); }
  #inputbar button {
    background: var(--red);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #inputbar button:disabled { opacity: 0.4; cursor: default; }
  .typing { color: #999; font-size: 13px; margin-left: 4px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="widget">
  <div id="header">
    <div class="title">Asistente Tiendas Full</div>
    <div class="subtitle">ACA · Atención al cliente</div>
  </div>
  <div id="messages"></div>
  <div id="inputbar">
    <input id="input" type="text" placeholder="Escribí tu consulta..." />
    <button id="send">Enviar</button>
  </div>
</div>

<script>
  // ⚠️ Reemplazá esta URL por la que te da Formspree al crear tu formulario
  // (Paso 3 de la guía de despliegue). Así llegan los datos de derivación a tu email.
  const FORMSPREE_URL = "https://formspree.io/f/mojgwokn";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let history = []; // historial para la API (role/content)
  let stage = "idle"; // idle | confirm | offer_escalate | contact
  let lastQuestion = "";
  let loading = false;

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row";
    row.style.justifyContent = role === "user" ? "flex-end" : "flex-start";
    const b = document.createElement("div");
    b.className = "bubble " + (role === "user" ? "user" : "bot");
    b.textContent = text;
    row.appendChild(b);
    messagesEl.appendChild(row);
    scrollDown();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function clearDynamic() {
    document.querySelectorAll(".dynamic").forEach((el) => el.remove());
  }

  function showConfirmButtons() {
    clearDynamic();
    const div = document.createElement("div");
    div.className = "actions dynamic";
    div.innerHTML = `
      <button class="btn" id="confirm-yes">Sí, gracias</button>
      <button class="btn" id="confirm-no">No</button>
    `;
    messagesEl.appendChild(div);
    scrollDown();
    document.getElementById("confirm-yes").onclick = () => handleConfirm(true);
    document.getElementById("confirm-no").onclick = () => handleConfirm(false);
  }

  function showOfferEscalate() {
    clearDynamic();
    const div = document.createElement("div");
    div.className = "actions dynamic";
    div.innerHTML = `
      <button class="btn" id="esc-yes">Sí, derivame</button>
      <button class="btn" id="esc-no">No, gracias</button>
    `;
    messagesEl.appendChild(div);
    scrollDown();
    document.getElementById("esc-yes").onclick = () => handleOfferEscalate(true);
    document.getElementById("esc-no").onclick = () => handleOfferEscalate(false);
  }

  function showContactForm() {
    clearDynamic();
    const div = document.createElement("div");
    div.className = "dynamic";
    div.style.background = "white";
    div.style.border = "1px solid #e0e0e0";
    div.style.borderRadius = "12px";
    div.style.padding = "12px";
    div.style.marginBottom = "12px";
    div.innerHTML = `
      <input id="c-name" placeholder="Nombre" style="width:100%;margin-bottom:8px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;" />
      <input id="c-phone" placeholder="Teléfono o email" style="width:100%;margin-bottom:8px;padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:14px;" />
      <button class="btn-primary" id="c-submit">Enviar</button>
    `;
    messagesEl.appendChild(div);
    scrollDown();
    document.getElementById("c-submit").onclick = handleContactSubmit;
  }

  function setLoading(v) {
    loading = v;
    inputEl.disabled = v || stage === "contact";
    sendBtn.disabled = v || stage === "contact";
    clearDynamic();
    if (v) {
      const t = document.createElement("div");
      t.className = "typing dynamic";
      t.textContent = "Escribiendo...";
      messagesEl.appendChild(t);
      scrollDown();
    }
  }

  async function sendMessage(text) {
    if (!text.trim() || loading) return;
    addBubble("user", text);
    lastQuestion = text;
    inputEl.value = "";
    history.push({ role: "user", content: text });
    setLoading(true);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      const reply = (data.reply || "").trim();

      if (!reply || reply.includes("NO_ENCONTRADO")) {
        history.push({ role: "assistant", content: reply || "NO_ENCONTRADO" });
        setLoading(false);
        addBubble("bot", "No tengo esa información en el manual. ¿Querés que derive tu consulta a una persona del equipo?");
        stage = "offer_escalate";
        showOfferEscalate();
      } else {
        history.push({ role: "assistant", content: reply });
        setLoading(false);
        addBubble("bot", reply);
        stage = "confirm";
        showConfirmButtons();
      }
    } catch (e) {
      setLoading(false);
      addBubble("bot", "Tuve un problema para responder. ¿Podés intentar de nuevo?");
      stage = "idle";
    }
  }

  function handleConfirm(resolved) {
    clearDynamic();
    if (resolved) {
      addBubble("user", "Sí, gracias");
      addBubble("bot", "¡Genial! Si tenés otra consulta, escribime cuando quieras.");
      stage = "idle";
    } else {
      addBubble("user", "No");
      addBubble("bot", "Entendido, te derivo con una persona del equipo. ¿Me pasás tu nombre y un teléfono o email de contacto?");
      stage = "contact";
      showContactForm();
    }
  }

  function handleOfferEscalate(accept) {
    clearDynamic();
    if (accept) {
      addBubble("user", "Sí, derivame");
      addBubble("bot", "Perfecto. ¿Me pasás tu nombre y un teléfono o email de contacto?");
      stage = "contact";
      showContactForm();
    } else {
      addBubble("user", "No, gracias");
      addBubble("bot", "Sin problema. Si tenés otra consulta, escribime cuando quieras.");
      stage = "idle";
    }
  }

  async function handleContactSubmit() {
    const name = document.getElementById("c-name").value.trim();
    const phone = document.getElementById("c-phone").value.trim();
    if (!name || !phone) return;

    try {
      await fetch(FORMSPREE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          nombre: name,
          contacto: phone,
          consulta: lastQuestion,
          fecha: new Date().toLocaleString("es-AR"),
        }),
      });
    } catch (e) {
      // si falla el envío del email, igual le confirmamos al cliente y seguimos
      console.error("Error enviando derivación:", e);
    }

    clearDynamic();
    addBubble("user", name + " - " + phone);
    addBubble("bot", "Gracias, ya derivé tu consulta al equipo. Te van a contactar a la brevedad. ¿Necesitás algo más?");
    stage = "idle";
    inputEl.disabled = false;
    sendBtn.disabled = false;
  }

  sendBtn.onclick = () => sendMessage(inputEl.value);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !loading && stage !== "contact") {
      sendMessage(inputEl.value);
    }
  });

  addBubble("bot", "Hola, soy el asistente de Tiendas Full de ACA, entrenado con el Manual Full completo. Preguntame lo que necesites.");
</script>

</body>
</html>
